# Gatik — briar-2 company configuration

company: gatik
cap: 4

sources:
  slack:
    bot_token_env: SLACK_BOT_TOKEN
    channels:
      - C0B6LCLAJ82   # ai-infra-notifications
      - C0CCV6S3A21   # AI Infrastructure (private)
    poll_every: 30s

  gitlab:
    token_env: GITLAB_TOKEN
    project: gatik/ai-infra
    poll_every: 1m

  github:
    token_env: GITHUB_TOKEN
    repos: []
    poll_every: 2m

  jira:
    token_env: JIRA_TOKEN
    jql: project = GAIT AND status != Done
    url: https://gatik.atlassian.net
    poll_every: 5m

actions:
  slack_draft: true
  gitlab_approve: false
  ci_fix_attempts: 3

paths:
  knowledge_root: "~/.cache/briar/knowledge/"
  lock_root: "~/.cache/briar/locks/"
  queue_root: "~/.cache/briar/queue/"
