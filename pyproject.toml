[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "briar2"
version = "0.1.0"
description = "Multi-company event-driven CLI: poll → queue → agent → action"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
gitlab = ["python-gitlab>=4.0"]
github = ["PyGithub>=2.0"]
jira = ["jira>=3.0"]

[project.scripts]
briar2 = "briar2.cli:MAIN"

[tool.hatch.build.targets.wheel]
packages = ["src/briar2"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
